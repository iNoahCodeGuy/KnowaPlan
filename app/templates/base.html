<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KnowaPlan{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1.5rem auto;
           max-width: 40rem; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 1.6rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem;
             border-bottom: 1px solid #ddd; font-size: .95rem; }
    form.stack label { display: block; margin: .8rem 0 .2rem; }
    input, select { font-size: 1rem; padding: .4rem; width: 100%;
                    max-width: 22rem; box-sizing: border-box; }
    button { font-size: 1rem; padding: .5rem 1rem; margin-top: 1rem;
             cursor: pointer; }
    .error { background: #fee; border: 1px solid #c99;
             padding: .6rem .8rem; }
    .muted { color: #666; font-size: .9rem; }
    .badge { font-size: .8rem; padding: .1rem .4rem;
             border: 1px solid #aaa; border-radius: .6rem;
             white-space: nowrap; }
    code { background: #f4f4f4; padding: .1rem .3rem;
           word-break: break-all; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
